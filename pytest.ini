[pytest]
# -v                         : verbose output
# --browser                  : chromium / firefox / webkit
# --headed                   : show the browser UI
# --base-url                 : default URL for page.goto("/")
# --video                    : keep video only for failed tests
# --screenshot               : screenshot only on failure
# --tracing                  : keep Playwright trace only for failed tests
# --html / self-contained    : single-file HTML report
# --capture=tee-sys          : show prints live and capture them for reports
# --alluredir                : Allure results folder
# -n 2                       : run tests in 2 parallel workers
# --reruns / --reruns-delay  : retry failed tests 3 times, 3 seconds apart
# conftest.py runs Chromium-based tests on both installed Chrome and Edge channels.

addopts =
    -v
    --browser=chromium
    --headed
    --base-url=https://testautomationpractice.blogspot.com/
    --video=on
    --screenshot=on
    --tracing=on
    --html=reports/report.html
    --self-contained-html
    --capture=tee-sys
    --alluredir=allure-results
    -n 2
    --reruns=3
    --reruns-delay=3@'
